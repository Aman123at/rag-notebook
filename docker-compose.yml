# Ports on the host:
#   3000  → client (Next.js)
#   8080  → server (Express API)
#   5432  → Postgres
#   6333  → Qdrant HTTP
#   6334  → Qdrant gRPC

services:
  postgres:
    image: postgres:16
    container_name: rag-notebook-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rag_notebook
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d rag_notebook']
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag-notebook-qdrant
    restart: unless-stopped
    ports:
      - '6333:6333'
      - '6334:6334'
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ['CMD-SHELL', 'bash -c ">/dev/tcp/localhost/6333"']
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: rag-notebook-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    env_file:
      - ./server/.env
    environment:
      # Overrides on top of server/.env. The container always listens on
      # 8080 regardless of what local dev uses — decouples the image from
      # anyone's personal .env, and the client bundle is baked to hit
      # localhost:8080. If you change SERVER_PORT below, also update
      # NEXT_PUBLIC_API_URL for the client build so the two agree.
      NODE_ENV: production
      PORT: '8080'
      APP_URL: http://localhost:8080
      CLIENT_ORIGINS: http://localhost:3000
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/rag_notebook
      QDRANT_URL: http://qdrant:6333
    ports:
      - '8080:8080'
    healthcheck:
      test:
        - CMD-SHELL
        - "node -e \"require('http').get('http://localhost:8080/api/v1/healthz', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* values are baked into the JS bundle at build time.
      # Change one → the image must be rebuilt (`docker compose build client`).
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v1}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        NEXT_PUBLIC_CONTRACT_VERSION: ${NEXT_PUBLIC_CONTRACT_VERSION:-1.3.0}
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
        # Read at prerender time by the client's env schema — see
        # client/Dockerfile for why the build needs it.
        CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
    container_name: rag-notebook-client
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    env_file:
      - ./client/.env
    ports:
      - '3000:3000'

volumes:
  postgres_data:
    name: rag-notebook-postgres-data
  qdrant_data:
    name: rag-notebook-qdrant-data
